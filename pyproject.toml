[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copyq-cpq-extractor"
version = "0.1.0"
description = "Extract CopyQ .cpq backups into ordered files by tab and item"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "cryptography>=41",
]

[project.scripts]
cpq-extract = "exitq.decoder:main"

[tool.setuptools.packages.find]
include = ["exitq*"]
