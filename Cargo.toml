[package]
name = "cpq-extract"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Extract CopyQ .cpq backups into ordered files by tab and item"
readme = "README.md"

[dependencies]
aes = "0.8.4"
base64 = "0.22"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
hkdf = "0.12"
hmac = "0.12"
mime_guess = "2.0"
pbkdf2 = "0.12"
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
unicode-normalization = "0.1"
zeroize = "1.8"
